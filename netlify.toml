# Netlify configuration — frontend (Next.js App Router)
#
# Deploy the REPOSITORY ROOT to Netlify; this file points the build at ./frontend.

[build]
  base = "frontend"
  command = "npm run build"
  # Must be named explicitly: when unset, Netlify defaults publish to the base
  # directory and @netlify/plugin-nextjs aborts with "Your publish directory
  # cannot be the same as the base directory of your site".
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so
  # NEXT_PUBLIC_API_URL must be set here (not only at runtime). It is the origin
  # that the /api/* rewrite proxies to, e.g. https://your-backend.vercel.app
  # Setting it keeps every browser request same-origin, so the backend needs no
  # CORS configuration.
  #
  # Must match frontend/netlify.toml. next.config.ts falls back to
  # http://localhost:4000 when this is missing; that fallback is baked into the
  # build and makes every /api/* route return HTTP 500 at runtime while the
  # build still passes.
  NEXT_PUBLIC_API_URL = "https://coaching-master-psi.vercel.app"
  NEXT_PUBLIC_APP_URL = "https://coachingmaster.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"