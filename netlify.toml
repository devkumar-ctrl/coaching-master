# Netlify configuration — this repository IS the Next.js app.
#
# Deploy the REPOSITORY ROOT. There is no base directory, and Netlify resolves
# this file from the repo root.
#
# `publish` must NOT be left unset. When it is unset Netlify defaults it to the
# repository root and @netlify/plugin-nextjs then aborts with:
#   "Your publish directory cannot be the same as the base directory of your site"
# Naming it explicitly breaks that collision.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # @netlify/plugin-nextjs v5 refuses to run on Node 20 and falls back to 22,
  # which logs a warning. Pin 22 so the build and the plugin agree.
  NODE_VERSION = "22"
  # NEXT_PUBLIC_* values are inlined into the client bundle at build time, so
  # NEXT_PUBLIC_API_URL must be present during the build (not only at runtime).
  # It is the origin that the /api/* rewrite in next.config.ts proxies to.
  # Keeping every browser request same-origin means the backend needs no CORS
  # configuration.
  #
  # These MUST be set here rather than only in the Netlify UI: next.config.ts
  # throws on a production build that is missing NEXT_PUBLIC_API_URL. An earlier
  # version silently fell back to http://localhost:4000, which got baked into
  # the build's routes manifest — the build then passed and every /api/* route
  # returned a plain-text HTTP 500, because Netlify's proxy could not reach
  # localhost. Keep this in sync with the backend's AUTH_URL.
  NEXT_PUBLIC_API_URL = "https://coaching-master-psi.vercel.app"
  # Canonical frontend origin. Auth.js on the backend sets AUTH_URL to the same
  # value; keeping them identical means session cookies are issued for the
  # production host.
  NEXT_PUBLIC_APP_URL = "https://superb-toffee-966a8c.netlify.app"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"